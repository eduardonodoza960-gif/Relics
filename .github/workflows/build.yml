name: Build Fabric Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descompactar o zip do mod
        run: |
          mkdir -p modsrc
          unzip -q ./*.zip -d modsrc
          # acha a pasta onde esta o build.gradle (mesmo se o zip tiver pasta extra)
          DIR=$(dirname "$(find modsrc -name build.gradle -not -path '*/node_modules/*' | head -n 1)")
          echo "MOD_DIR=$DIR" >> $GITHUB_ENV
          echo "Projeto encontrado em: $DIR"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build with Gradle
        working-directory: ${{ env.MOD_DIR }}
        run: gradle build --no-daemon

      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: imdd-reliquias-1.21.4
          path: ${{ env.MOD_DIR }}/build/libs/*.jar
